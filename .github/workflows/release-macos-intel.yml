# Experimental macOS builds on an Intel runner: the same as release-macos.yml
# (both arm64 and amd64 are cross-built on one Mac), for when GitHub has no
# macOS arm64 runner to give (v1.3.10 waited three times and was cancelled).
# Run by hand only, with the tag to build; uploads to that tag's release,
# draft or published.
name: Release (macOS Intel)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build and upload (e.g. v1.3.9)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-macos-intel-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: macOS (Intel runner)
    runs-on: macos-15-intel
    timeout-minutes: 30
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - name: Check the version and signing key
        env:
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          version="$(jq -r .version mygo.json)"
          test "$TAG" = "v$version"
          test -n "$MYGO_UPDATER_PRIVATE_KEY"
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build macOS apps and signed updates
        env:
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
        run: go tool mygo build -platform "darwin/arm64,darwin/amd64"
      - name: Wait for release and upload macOS assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(jq -r .version mygo.json)"
          slug="$(jq -r .slug mygo.json)"
          out="$(jq -r '.out // "dist"' mygo.json)"

          # release.yml's draft-release job creates the tag's release; wait
          # briefly in case it is still starting.
          found=0
          for _ in $(seq 1 18); do
            if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
              found=1
              break
            fi
            sleep 10
          done
          if [ "$found" -ne 1 ]; then
            echo "Release $TAG does not exist yet; run the Release workflow first." >&2
            exit 1
          fi

          # Upload installers and update archives before manifests so installed
          # apps never see a manifest pointing at a missing archive. Leave out
          # install.sh and SHA256SUMS, matching release.yml.
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber \
            "$out/darwin-arm64/${slug}-${version}-arm64.dmg" \
            "$out/darwin-arm64/${slug}-${version}-darwin-arm64.tar.gz" \
            "$out/darwin-amd64/${slug}-${version}-amd64.dmg" \
            "$out/darwin-amd64/${slug}-${version}-darwin-amd64.tar.gz"
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber \
            "$out/darwin-arm64/update-darwin-arm64.json" \
            "$out/darwin-amd64/update-darwin-amd64.json"
