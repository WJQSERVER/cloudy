# Pushing a tag such as v1.0.0 builds the apps of Windows, signs their
# updates, and uploads them to a draft release of the tag, which is published
# by hand: installed apps update to it then. The same can be started by hand
# with the tag to build. macOS and Linux, experimental, build in
# release-macos.yml and release-linux.yml, so that they never fail or hold up
# this one.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build and upload (e.g. v1.3.11u1)"
        required: true
        type: string

permissions:
  contents: write # the draft release, and the uploads to it

jobs:
  draft-release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      # mygo build uploads to the release of mygo.json's version, whichever
      # tag started the workflow.
      - name: Check the version
        run: test "$TAG" = "v$(jq -r .version mygo.json)"
      # mygo build puts the version's section of CHANGELOG.md in the update
      # manifests, which the update window shows; the release page gets the
      # same notes, in place of GitHub's from the pull requests.
      - name: Take the notes from the changelog
        run: |
          awk -v heading="## ${TAG#v}" '
            /^## / { inside = ($0 == heading); next }
            inside
          ' CHANGELOG.md | sed '/./,$!d' > "$RUNNER_TEMP/notes.md"
          test -s "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --draft --verify-tag --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
          fi

  build:
    needs: draft-release
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Windows, os: ubuntu-latest, platform: "windows/amd64,windows/arm64" }
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install NSIS, for the Windows installers
        if: matrix.name == 'Windows'
        # The runner's own Ubuntu mirrors have failed to resolve for a while
        # (1.2.10): another mirror then, under another domain.
        run: |
          sudo apt-get update && sudo apt-get install -y nsis && exit 0
          list=/etc/apt/sources.list.d/fallback-mirror.list
          for mirror in http://mirrors.edge.kernel.org/ubuntu http://mirror.us.leaseweb.net/ubuntu; do
            echo "deb $mirror $(lsb_release -cs) main universe" | sudo tee "$list"
            opts="-o Dir::Etc::sourcelist=$list -o Dir::Etc::sourceparts=-"
            sudo apt-get update $opts && sudo apt-get install -y $opts nsis && exit 0
          done
          exit 1
      - name: Build and upload
        env:
          GH_TOKEN: ${{ github.token }}
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
        run: go tool mygo build -platform "${{ matrix.platform }}" -upload
      # The release holds the two installers and what installed apps update
      # from (the manifests and archives): the install script and its
      # checksums aren't offered, and mygo.json asks for no deltas.
      - name: Leave out the install script
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for name in install.ps1 SHA256SUMS; do
            gh release delete-asset "$TAG" "$name" --repo "$GITHUB_REPOSITORY" --yes || true
          done
      # Installers are named Cloudy-<version>-<arch>-<os>...: GitHub lists a
      # release's files by name, ignoring case, and the architecture first
      # (amd64, arm64) puts all six installers over the update archives
      # (cloudy-<version>-darwin-...), whose names install.sh relies on. The
      # same in release-linux.yml and release-macos*.yml.
      - name: Name the installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          for arch in amd64 arm64; do
            from="cloudy-setup-${version}-${arch}.exe"
            to="Cloudy-${version}-${arch}-windows-setup.exe"
            url="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets \
              -q ".assets[] | select(.name == \"$from\") | .apiUrl")"
            test -n "$url"
            # Run again, the installer was uploaded anew under its old name.
            gh release delete-asset "$TAG" "$to" --repo "$GITHUB_REPOSITORY" --yes || true
            gh api -X PATCH "$url" -f name="$to" > /dev/null
          done
